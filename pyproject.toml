[project]
name = "thesis-work"
version = "0.1.0"
description = "Ship motion prediction experiment package."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "vmdpy>=0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ship_motion*"]
