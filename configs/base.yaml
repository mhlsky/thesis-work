# 本文件是项目的数据与训练基础配置。
# 可以先把它理解成“实验参数总开关”：
# - data: 数据来自哪里、每个样本怎么切
# - train: 训练过程的一些基础参数
# - output_dir: 结果默认输出到哪里
#
# Step 02 开始，这里在保留 Step 01 原有说明的基础上，
# 补充了训练 epoch、学习率、早停、设备等字段，
# 方便后续所有 baseline 配置复用。

data:
  # 训练集目录。标准化器的均值/标准差只会使用这里的 CSV 来统计。
  train_dir: data/patrol_ship_routine/processed/train

  # 验证集目录。用于调参或中途评估，不参与标准化参数拟合。
  val_dir: data/patrol_ship_routine/processed/validation

  # 常规测试集目录。通常用于评估模型在“同分布”数据上的表现。
  routine_test_dir: data/patrol_ship_routine/processed/test

  # OOD(out-of-distribution) 测试集目录。
  # 一般表示分布偏离训练集的数据，用于测试模型泛化能力。
  ood_test_dir: data/patrol_ship_ood/processed/test

  # 外生变量列。
  # 可粗略理解为“影响系统但不一定是系统当前状态本身的输入量/环境量/控制量”。
  exog_cols: [n, deltal, deltar, Vw, alpha_x, alpha_y]

  # 状态变量列。
  # 这些通常是模型最终要预测的船舶运动状态。
  state_cols: [u, v, p, r, phi]

  # 输入特征列。每个历史时间步会把这些字段一起送给模型。
  input_cols: [n, deltal, deltar, Vw, alpha_x, alpha_y, u, v, p, r, phi]

  # 目标列。模型需要预测未来若干步的这些字段。
  target_cols: [u, v, p, r, phi]

  # 历史窗口长度。
  # 例如 128 表示：每个样本都要取过去 128 个时间步作为输入。
  seq_len: 128

  # 预测窗口长度。
  # 例如 10 表示：模型要预测未来连续 10 个时间步。
  pred_len: 10

  # 滑动步长。
  # 1 表示窗口每次向前滑 1 个时间步；值越大，样本重叠越少。
  stride: 1

  # 最多读取多少个文件。
  # null 表示不限制；smoke test 时程序可能会临时改小这个值。
  max_files: null

  # 每个文件最多切多少个窗口样本。
  # null 表示不限制；用于加速调试和冒烟测试很有用。
  max_windows_per_file: null

train:
  # 随机种子。用于尽量复现实验结果。
  seed: 42

  # 每个 batch 含多少个样本。
  batch_size: 128

  # 训练多少个 epoch。
  # 正式实验可以较大，smoke test 会自动覆盖成更小的值。
  epochs: 50

  # AdamW 学习率。
  lr: 0.001

  # AdamW 权重衰减。
  # 可以把它理解成一种轻量正则化，帮助抑制过拟合。
  weight_decay: 0.0001

  # 梯度裁剪阈值。
  # RNN 类模型出现梯度过大时，这个值可以帮助训练更稳定。
  grad_clip: 1.0

  # 早停耐心值。
  # 如果验证集指标连续这么多轮没有提升，就提前结束训练。
  early_stop_patience: 8

  # DataLoader 等并行读取数据时的工作进程数。
  # Linux + CUDA 服务器训练时建议大于 0，让 CPU 提前准备 batch。
  # smoke test 会自动改回 0，避免本地小机器压力过大。
  num_workers: 4

  # 是否把 batch 先放进 page-locked memory。
  # auto 表示：当 device 最终解析成 CUDA 时自动开启，加快 CPU -> GPU 拷贝。
  pin_memory: auto

  # 是否复用 DataLoader worker，避免每个 epoch 反复重建进程。
  # auto 表示：num_workers > 0 时自动开启。
  persistent_workers: auto

  # 每个 worker 预取多少个 batch。
  # 只有 num_workers > 0 时生效；null 表示使用 PyTorch 默认行为。
  prefetch_factor: 2

  # 是否允许 non_blocking 张量搬运。
  # auto 表示：CUDA + pin_memory 时自动开启。
  non_blocking: auto

  # 训练设备。
  # auto 表示：有 CUDA 就用 CUDA，没有就自动回退到 CPU。
  device: auto

  # 每个 epoch 最多训练多少个 batch。
  # null 表示不限制；本地 smoke test 时通常会被自动压小。
  max_train_steps_per_epoch: null

  # 每次验证/测试最多评估多少个 batch。
  # null 表示不限制；本地 smoke test 时通常会被自动压小。
  max_eval_steps: null

# 输出目录。
# 例如 smoke test 保存的 scaler.json、checkpoint、metrics
# 都会默认落在这个根目录下的某个 run 子目录里。
output_dir: outputs

# 当前实验运行名。
# 正式训练时建议让每个模型配置单独覆盖这个名字，避免输出互相覆盖。
run_name: base_experiment

model:
  # 模型名字。
  # Step 02 可选：persistence / lstm / gru / tcn / transformer
  name: lstm

  # 输入维度。通常等于 input_cols 的列数。
  input_dim: 11

  # 目标维度。通常等于 target_cols 的列数。
  target_dim: 5

  # 下面这些字段主要给循环网络作为默认值。
  # 不同模型配置文件会按需覆盖。
  hidden_dim: 128
  num_layers: 2
  dropout: 0.1
