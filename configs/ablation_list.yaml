# Step 07 主线消融实验清单。
# 这个文件只负责描述“哪些 run 需要进入汇总与绘图”，
# 便于后续脚本统一读取，而不是把 run 名称硬编码在多个脚本里。

runs:
  - order: 0
    run_name: persistence_seq128_pred10
    config: configs/persistence.yaml
    display_name: Persistence
    category: baseline

  - order: 1
    run_name: lstm_seq128_pred10
    config: configs/lstm.yaml
    display_name: LSTM
    category: baseline

  - order: 2
    run_name: gru_seq128_pred10
    config: configs/gru.yaml
    display_name: GRU
    category: baseline

  - order: 3
    run_name: transformer_seq128_pred10
    config: configs/transformer.yaml
    display_name: Transformer
    category: baseline

  - order: 4
    run_name: lite_xlstm_seq128_pred10
    config: configs/lite_xlstm.yaml
    display_name: Lite-xLSTM
    category: main

  - order: 5
    run_name: ccg_xlstm_seq128_pred10
    config: configs/ccg_xlstm.yaml
    display_name: CCG-xLSTM
    category: main

  - order: 6
    run_name: vmd_ccg_xlstm_seq128_pred10
    config: configs/vmd_ccg_xlstm.yaml
    display_name: VMD-CCG-xLSTM
    category: main

  - order: 7
    run_name: vmd_ccg_phys_xlstm_seq128_pred10
    config: configs/vmd_ccg_phys_xlstm.yaml
    display_name: VMD-CCG-Phys-xLSTM
    category: final

optional_runs:
  - run_name: tcn_seq128_pred10
    config: configs/tcn.yaml
    display_name: TCN

  - run_name: vmd_ccg_attn_phys_xlstm_seq128_pred10
    config: configs/vmd_ccg_attn_phys_xlstm.yaml
    display_name: VMD-CCG-Attn-Phys-xLSTM
