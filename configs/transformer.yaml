# Transformer Encoder 注意力基线配置。
# 它用于和后续 xLSTM、可选注意力增强做对照。

data:
  train_dir: data/patrol_ship_routine/processed/train
  val_dir: data/patrol_ship_routine/processed/validation
  routine_test_dir: data/patrol_ship_routine/processed/test
  ood_test_dir: data/patrol_ship_ood/processed/test
  exog_cols: [n, deltal, deltar, Vw, alpha_x, alpha_y]
  state_cols: [u, v, p, r, phi]
  input_cols: [n, deltal, deltar, Vw, alpha_x, alpha_y, u, v, p, r, phi]
  target_cols: [u, v, p, r, phi]
  seq_len: 128
  pred_len: 10
  stride: 1
  max_files: null
  max_windows_per_file: null

train:
  seed: 42
  batch_size: 128
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stop_patience: 8
  num_workers: 4
  pin_memory: auto
  persistent_workers: auto
  prefetch_factor: 2
  non_blocking: auto
  device: auto
  max_train_steps_per_epoch: null
  max_eval_steps: null

output_dir: outputs
run_name: transformer_seq128_pred10

model:
  name: transformer
  input_dim: 11
  target_dim: 5

  # d_model 是 Transformer 内部隐藏维度，必须能被 nhead 整除。
  d_model: 128

  # 多头注意力头数。
  nhead: 4

  # Encoder 层数。
  num_layers: 2

  # 前馈网络维度。
  # 这里显式写出来，便于小白理解 Transformer 不只有注意力层。
  dim_feedforward: 256

  # Dropout 会用于 attention、前馈层和输出头。
  dropout: 0.1
