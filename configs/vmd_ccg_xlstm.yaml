# Step 05：VMD-CCG-xLSTM 配置。
# 目标：把 CCG-xLSTM backbone、VMD 多模态辅助监督、Delta Decoder、
# State Coupling Mixer 串成第一个较完整的主线模型。

data:
  # 四个数据划分目录沿用基础实验设置。
  train_dir: data/patrol_ship_routine/processed/train
  val_dir: data/patrol_ship_routine/processed/validation
  routine_test_dir: data/patrol_ship_routine/processed/test
  ood_test_dir: data/patrol_ship_ood/processed/test

  # 外生控制/环境量。
  exog_cols: [n, deltal, deltar, Vw, alpha_x, alpha_y]

  # 船舶状态量，也是后续 VMD 分解目标与未来预测目标。
  state_cols: [u, v, p, r, phi]

  # 模型历史输入列：外生量 + 状态量。
  input_cols: [n, deltal, deltar, Vw, alpha_x, alpha_y, u, v, p, r, phi]

  # 未来预测目标列。
  target_cols: [u, v, p, r, phi]

  # 历史窗口与预测窗口长度。
  seq_len: 128
  pred_len: 10
  stride: 1

  # 正式构建缓存时默认不截断文件数和窗口数。
  max_files: null
  max_windows_per_file: null

train:
  seed: 42
  batch_size: auto
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  early_stop_patience: 8
  num_workers: auto
  pin_memory: auto
  persistent_workers: auto
  prefetch_factor: auto
  non_blocking: auto
  precision: auto
  device: auto
  max_train_steps_per_epoch: null
  max_eval_steps: null

vmd:
  # 开启 VMD 后，Dataset 会额外返回 y_modes 作为辅助监督标签。
  enabled: true

  # VMD 模态数，默认拆成趋势 / 周期 / 扰动三类。
  K: 3

  # 带宽约束系数，采用常见默认值。
  alpha: 2000

  # 噪声容忍参数。0 表示严格重构。
  tau: 0.0

  # 是否强制包含直流分量。
  DC: false

  # 初始化方式。1 通常表示均匀初始化中心频率。
  init: 1

  # VMD 迭代停止阈值，越小越严格。
  tol: 1.0e-7

  # VMD 辅助损失权重：总损失 = 预测 MSE + lambda_vmd * VMD MSE
  lambda_vmd: 0.2

  # 训练前几轮先让主预测站稳，再线性拉起 VMD 辅助损失，
  # 避免一开始就被模态监督带偏。
  warmup_epochs: 5

  # VMD 缓存根目录。程序会在下面自动创建 train / validation / routine_test / ood_test 子目录。
  cache_root: outputs/cache/vmd/K3_alpha2000

output_dir: outputs
run_name: vmd_ccg_xlstm_seq128_pred10

model:
  name: vmd_ccg_xlstm

  # 输入由 6 维外生量和 5 维状态量组成。
  exog_dim: 6
  state_dim: 5
  target_dim: 5

  # backbone 隐藏宽度。
  d_model: 128

  # 外生量 MLP 上下文宽度。
  context_dim: 64

  # 堆叠多少层 CCG xLSTM block。
  num_layers: 2
  dropout: 0.1

  # exp 门控前的裁剪范围。
  gate_clip: 5.0

  # delta：预测增量后累计；direct：直接预测未来状态。
  decode_type: delta

  # 是否使用状态耦合修正。
  use_state_mixer: true

  # 状态耦合 MLP 的隐藏宽度。
  state_mixer_hidden_dim: 16

  # 状态耦合 MLP 的 dropout。
  state_mixer_dropout: 0.0
